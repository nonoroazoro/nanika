[package]
name = "nanika-extension-application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
directories.workspace = true
nanika-config = { path = "../../crates/nanika-config" }
nanika-core = { path = "../../crates/nanika-core" }
nanika-protocol = { path = "../../crates/nanika-protocol" }
rusqlite.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
walkdir.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
icns.workspace = true
plist.workspace = true

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true

[[test]]
name = "ExtensionProcess"
path = "tests/ExtensionProcess.rs"

[[bench]]
name = "indexing"
harness = false
