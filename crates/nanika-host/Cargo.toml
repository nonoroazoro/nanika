[package]
name = "nanika-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
agent-client-protocol.workspace = true
accesskit_winit.workspace = true
async-channel.workspace = true
async-io.workspace = true
async-process.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
futures.workspace = true
futures-lite.workspace = true
fontdb.workspace = true
global-hotkey.workspace = true
nanika-core = { path = "../nanika-core" }
nanika-config = { path = "../nanika-config" }
nanika-extension-package = { path = "../nanika-extension-package" }
nanika-platform = { path = "../nanika-platform" }
nanika-search = { path = "../nanika-search" }
nanika-protocol = { path = "../nanika-protocol" }
nanika-storage = { path = "../nanika-storage" }
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true

[dev-dependencies]
criterion.workspace = true

[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan", "wgsl"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
rustix.workspace = true
wgpu = { workspace = true, features = ["metal", "wgsl"] }

[lints]
workspace = true

[[bench]]
name = "runtime"
harness = false
