[package]
name = "nanika-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
eframe.workspace = true
global-hotkey.workspace = true
nanika-core = { path = "../nanika-core" }
nanika-config = { path = "../nanika-config" }
nanika-extension-package = { path = "../nanika-extension-package" }
nanika-platform = { path = "../nanika-platform" }
nanika-search = { path = "../nanika-search" }
nanika-protocol = { path = "../nanika-protocol" }
nanika-storage = { path = "../nanika-storage" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
criterion.workspace = true

[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal", "wgsl"] }

[lints]
workspace = true

[[bench]]
name = "runtime"
harness = false
