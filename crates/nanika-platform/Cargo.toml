[package]
name = "nanika-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
clipboard-rs.workspace = true
global-hotkey = "0.8.0"
nanika-protocol = { path = "../nanika-protocol" }
png.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[[test]]
name = "ProcessLauncher"
path = "tests/ProcessLauncher.rs"

[[test]]
name = "SingleInstance"
path = "tests/SingleInstance.rs"
