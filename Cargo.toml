[workspace]
resolver = "3"
members = [
    "crates/nanika-core",
    "crates/nanika-host",
    "crates/nanika-platform",
    "crates/nanika-protocol",
    "crates/nanika-storage",
    "crates/nanika-config",
    "crates/nanika-search",
    "crates/nanika-extension-package",
    "crates/nanika-cli",
    "extensions/nanika-extension-fixture",
    "extensions/nanika-extension-application",
    "extensions/nanika-extension-command",
    "extensions/nanika-extension-script",
    "extensions/nanika-extension-calculator",
    "extensions/nanika-extension-clipboard",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
directories = "6.0.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
jsonc-parser = { version = "0.33.1", default-features = false, features = ["serde", "cst"] }
uuid = { version = "1.24.1", default-features = false, features = ["serde", "v4"] }
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu_no_default_features"] }
wgpu = { version = "30.0.0", default-features = false }
global-hotkey = "0.8.0"
nucleo-matcher = "0.3.1"
criterion = { version = "0.8.2", default-features = false }
semver = "1.0.27"
sha2 = "0.11.0"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
zip = { version = "8.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
walkdir = "2.5.0"
plist = "1.10.0"
icns = "0.4.0"
png = "0.18.1"
windows = { version = "0.62.2", default-features = false }
windows-sys = "0.61.2"
clipboard-rs = "0.3.5"
fend-core = "1.5.8"
windows-registry = "0.6.1"
objc2-service-management = { version = "0.3.2", default-features = false }
objc2 = { version = "0.6.4", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
