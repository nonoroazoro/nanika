[package]
name = "nanika-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
async-process.workspace = true
clipboard-rs.workspace = true
nanika-protocol = { path = "../extension-protocol" }
png.workspace = true
sys-locale.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
rustix.workspace = true
libc = "0.2.189"
objc2-service-management = { workspace = true, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
objc2 = { workspace = true, features = ["std"] }
objc2-app-kit = { workspace = true, features = ["std", "NSEvent", "NSScreen"] }
objc2-foundation = { workspace = true, features = ["std", "NSObject", "NSString"] }

[[test]]
name = "ProcessLauncher"
path = "tests/ProcessLauncher.rs"

[[test]]
name = "SingleInstance"
path = "tests/SingleInstance.rs"

[[test]]
name = "filesystem"
path = "tests/filesystem.rs"
