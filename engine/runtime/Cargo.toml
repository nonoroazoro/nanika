autotests = false

[dependencies]
agent-client-protocol.workspace = true
async-channel.workspace = true
async-io.workspace = true
async-process.workspace = true
futures.workspace = true
futures-lite.workspace = true
nanika-core = { path = "../domain" }
nanika-config = { path = "../configuration" }
nanika-extension-package = { path = "../extension-management" }
nanika-platform = { path = "../platform" }
nanika-search = { path = "../search" }
nanika-protocol = { path = "../extension-protocol" }
nanika-storage = { path = "../storage" }
