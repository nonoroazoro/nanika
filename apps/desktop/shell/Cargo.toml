[package]
name = "nanika-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "nanika_desktop"

[build-dependencies]
tauri-build = { workspace = true, features = ["codegen", "isolation"] }

[dependencies]
nanika-builtin-inventory = { path = "../../extensions/built-in" }
ts-rs = { workspace = true, optional = true }
async-channel.workspace = true
nanika-localization = { path = "../../../engine/localization" }
nanika-foundation = { path = "../../../engine/foundation" }
nanika-config = { path = "../../../engine/configuration" }
nanika-platform = { path = "../../../engine/platform" }
nanika-protocol = { path = "../../../engine/extension-protocol" }
nanika-host = { path = "../../../engine/runtime" }
nanika-search = { path = "../../../engine/search" }
nanika-text-search = { path = "../../../engine/text-search" }
nanika-storage = { path = "../../../engine/storage" }
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["common-controls-v6", "compression", "isolation", "macos-private-api", "tray-icon", "wry"] }
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-dialog.workspace = true
tracing.workspace = true

[dev-dependencies]
png.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[features]
e2e = []
typescript = ["nanika-localization/typescript", "dep:ts-rs", "nanika-host/typescript", "nanika-config/typescript", "nanika-protocol/typescript", "nanika-search/typescript", "nanika-platform/typescript"]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
