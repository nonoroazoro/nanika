[package]
name = "nanika-extension-application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
directories.workspace = true
nanika-config = { path = "../../../../engine/configuration" }
nanika-core = { path = "../../../../engine/domain" }
nanika-protocol = { path = "../../../../engine/extension-protocol" }
rusqlite.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
walkdir.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
icns.workspace = true
objc2 = { workspace = true, features = ["std"] }
objc2-app-kit = { workspace = true, features = ["std", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSWorkspace"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFData"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSBundle", "NSData", "NSDictionary", "NSEnumerator", "NSFileManager", "NSLocale", "NSString", "objc2-core-foundation"] }
plist.workspace = true

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true

[[test]]
name = "ExtensionProcess"
path = "tests/ExtensionProcess.rs"

[[bench]]
name = "indexing"
harness = false
