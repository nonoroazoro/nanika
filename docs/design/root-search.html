html &gt; body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],

  background: var(--primary);

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

  }

  }

    height: 44px;
  }

    (() =&gt; {
      const root = document.getElementById(&#x27;nanika-root-search-mockup&#x27;);
      const rootView = root.querySelector(&#x27;.nanika-root-view&#x27;);
      const clipboardView = root.querySelector(&#x27;.nanika-clipboard&#x27;);
      const searchInput = root.querySelector(&#x27;.nanika-search-input&#x27;);
      const filterInput = root.querySelector(&#x27;.nanika-filter-input&#x27;);
      const results = Array.from(root.querySelectorAll(&#x27;.nanika-result&#x27;));
      const empty = root.querySelector(&#x27;.nanika-empty&#x27;);
      const groups = root.querySelector(&#x27;.nanika-result-groups&#x27;);
      const footerLabel = root.querySelector(&#x27;.nanika-footer-label&#x27;);

      function visibleResults() {
        return results.filter((result) =&gt; result.style.display !== &#x27;none&#x27;);
      }

      function select(result) {
        results.forEach((entry) =&gt; entry.dataset.selected = String(entry === result));
        footerLabel.textContent = result ? `${result.dataset.action === &#x27;clipboard&#x27; ? &#x27;Open&#x27; : &#x27;Launch&#x27;} ${result.dataset.name}` : &#x27;No result selected&#x27;;
      }

      function openClipboard() {
        rootView.dataset.hidden = &#x27;true&#x27;;
        clipboardView.dataset.open = &#x27;true&#x27;;
        window.setTimeout(() =&gt; filterInput.focus(), 0);
      }

      function closeClipboard() {
        rootView.dataset.hidden = &#x27;false&#x27;;
        clipboardView.dataset.open = &#x27;false&#x27;;
        window.setTimeout(() =&gt; searchInput.focus(), 0);
      }

      function activate(result) {
        if (result &amp;&amp; result.dataset.action === &#x27;clipboard&#x27;) {
          openClipboard();
        }
      }

      results.forEach((result) =&gt; {
        result.addEventListener(&#x27;mouseenter&#x27;, () =&gt; select(result));
        result.addEventListener(&#x27;click&#x27;, () =&gt; activate(result));
      });

      searchInput.addEventListener(&#x27;input&#x27;, () =&gt; {
        const query = searchInput.value.trim().toLowerCase();
        results.forEach((result) =&gt; {
          const haystack = `${result.dataset.name} ${result.dataset.keywords}`.toLowerCase();
          result.style.display = haystack.includes(query) ? &#x27;&#x27; : &#x27;none&#x27;;
        });
        const visible = visibleResults();
        groups.style.display = visible.length ? &#x27;&#x27; : &#x27;none&#x27;;
        empty.style.display = visible.length ? &#x27;none&#x27; : &#x27;grid&#x27;;
        select(visible[0]);
      });

      searchInput.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        const visible = visibleResults();
        const selected = visible.findIndex((result) =&gt; result.dataset.selected === &#x27;true&#x27;);
        if (event.key === &#x27;ArrowDown&#x27; &amp;&amp; visible.length) {
          event.preventDefault();
          select(visible[(selected + 1 + visible.length) % visible.length]);
        }
        if (event.key === &#x27;ArrowUp&#x27; &amp;&amp; visible.length) {
          event.preventDefault();
          select(visible[(selected - 1 + visible.length) % visible.length]);
        }
        if (event.key === &#x27;Enter&#x27; &amp;&amp; selected &gt;= 0) {
          event.preventDefault();
          activate(visible[selected]);
        }
      });

      root.querySelector(&#x27;.nanika-back&#x27;).addEventListener(&#x27;click&#x27;, closeClipboard);
      filterInput.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (event.key === &#x27;Escape&#x27;) closeClipboard();
      });
    })();
